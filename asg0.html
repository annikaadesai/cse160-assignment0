<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Draw a blue rectangle (canvas version)</title>
  </head>

  <body onload="main()">
    <canvas id="cnv1" width="400" height="400">
      Please use a browser that supports "canvas"
    </canvas>
    <br>
    <label for="x-coord-v1">v1: x</label>
    <input type="number" id="x-coord-v1" value="0" step="0.1">
    <label for="y-coord-v1"> y</label>
    <input type="number" id="y-coord-v1" value="5" step="0.1">
    <br>
    <label for="x-coord-v2">v2: x</label>
    <input type="number" id="x-coord-v2" value="5" step="0.1">
    <label for="y-coord-v2"> y</label>
    <input type="number" id="y-coord-v2" value="0" step="0.1">
    <br>
    <button onclick="handleDrawEvent()">Draw</button>
    <br><br>
    <label for="operation-select">Operation:</label>
    <select id="operation-select">
      <option value="add">Add</option>
      <option value="sub">Subtract</option>
      <option value="mul">Multiply</option>
      <option value="div">Divide</option>
      <option value="mag">Magnitude</option>
      <option value="norm">Normalize</option>
      <option value="angle">Angle Between</option>
      <option value="area">Area</option>
  </select>
  <label for="scalar">Scalar:</label>
  <input type="number" id="scalar" value="1" step="0.1">
  <br>
  <button onclick="handleDrawOperationEvent()">Draw</button>
  <script src="asg0.js"></script>
  <script src="lib/cuon-matrix-cse160.js"></script>
  </body>
</html>
